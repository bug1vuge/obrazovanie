<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Study Pro</title>
    <script>
      // Turn /obrazovanie/course/k-math into /obrazovanie/#/course/k-math.
      (function () {
        var base = '/obrazovanie/';
        var path = window.location.pathname;
        var rest = path.indexOf(base) === 0 ? path.slice(base.length) : '';
        window.location.replace(base + (rest ? '#/' + rest + window.location.search : ''));
      })();
    </script>
  </head>
  <body></body>
</html>
